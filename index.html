<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
<title>入籍陷阱題特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E7ECEE; --ink:#15202A; --muted:#566471; --line:#D3DBDF;
  --accent:#0F5E6B; --accent-ink:#FFFFFF; --accent-soft:#DDEFF1;
  --trap:#A34405; --trap-bg:#FDEBD8;
  --good:#146C3E; --good-bg:#E0F3E8; --bad:#AE2318; --bad-bg:#FBE4E1;
  --en:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --zh:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E151A; --surface:#162129; --sunk:#1E2B34; --ink:#E4EBEF; --muted:#94A3AF; --line:#2A3A45;
    --accent:#5DB6C2; --accent-ink:#0B1A1F; --accent-soft:#16343A;
    --trap:#F2A45F; --trap-bg:#3A2614;
    --good:#6FD19A; --good-bg:#15301F; --bad:#F2877C; --bad-bg:#3A1A17;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E151A; --surface:#162129; --sunk:#1E2B34; --ink:#E4EBEF; --muted:#94A3AF; --line:#2A3A45;
  --accent:#5DB6C2; --accent-ink:#0B1A1F; --accent-soft:#16343A;
  --trap:#F2A45F; --trap-bg:#3A2614;
  --good:#6FD19A; --good-bg:#15301F; --bad:#F2877C; --bad-bg:#3A1A17;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand h1{font-size:26px;font-weight:700;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-bottom:20px;overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;border:0;background:transparent;padding:9px 12px;border-radius:7px;font-size:15px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px;font-family:var(--mono)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.set h3{font-size:19px}
.set .meta{color:var(--muted);font-size:13px;font-family:var(--mono)}
.set .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
/* question card */
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.qhead .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--trap-bg);color:var(--trap);font-weight:700}
.tag.ch{background:var(--sunk);color:var(--muted);font-weight:500}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qen{font-family:var(--en);font-size:22px;line-height:1.45;font-weight:700;margin:0}
.qen mark{background:var(--trap-bg);color:var(--trap);padding:0 3px;border-radius:3px}
.qzh{margin:8px 0 0;color:var(--muted);font-size:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--mono);font-size:14px;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.opt .t{display:flex;flex-direction:column;gap:2px}
.opt .en{font-family:var(--en);font-size:18px;line-height:1.4}
.opt .zh{font-size:14px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;border:1px solid var(--line);background:var(--sunk)}
.fb .res{font-weight:700;font-size:17px;margin-bottom:4px}
.fb .res.ok{color:var(--good)} .fb .res.no{color:var(--bad)}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vocab span{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.vocab span b{font-family:var(--en)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dots button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px}
.dots button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dots button.cur{outline:2px solid var(--ink)}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-family:var(--en);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .pass{color:var(--good)} .score .fail{color:var(--bad)}
.list{display:grid;gap:12px;margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.item .qen{font-size:18px}
.item .ans{margin-top:8px;font-size:15px}
.item .ans .en{font-family:var(--en);font-weight:700;color:var(--good)}
.item .your{color:var(--bad);font-size:14px}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin-top:8px}
table.dict{width:100%;border-collapse:collapse;font-size:15px}
.dictwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.dict th,table.dict td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.dict th{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.dict td:first-child{font-family:var(--en);font-weight:700;white-space:nowrap}
table.dict tr:last-child td{border-bottom:0}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl li{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .yr{font-family:var(--en);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}
.tl .who{font-family:var(--en);font-weight:700;font-size:17px}
.tl .who small{font-family:var(--zh);font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.tl .what{font-size:15px;margin-top:2px}
.tl .ask{margin-top:6px;font-size:14px;color:var(--trap);background:var(--trap-bg);border-radius:6px;padding:4px 8px;display:inline-block}
.tl .ask span{font-family:var(--en)}
@media (max-width:480px){.tl li{grid-template-columns:1fr;gap:4px}}
@media (max-width:480px){.qen{font-size:20px}.opt .en{font-size:17px}.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.who button{border:0;background:none;color:var(--accent);padding:4px 2px;font-size:14px;text-decoration:underline}
.login{max-width:420px;margin:8px auto 0}
.login label{display:block;font-weight:700;margin:14px 0 6px}
.login input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.login .btn{width:100%;margin-top:18px;padding:12px}
.login .err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:8px}
.flash{background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Canadian Citizenship Test · Trap Edition</div>
      <h1>入籍陷阱題特訓</h1>
      <p>題目換個方式問，答案還是同一個。依官方 Discover Canada 內容編寫。</p>
    </div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-home" aria-selected="true" data-tab="home">三套題目</button>
    <button role="tab" id="tab-wrong" aria-selected="false" data-tab="wrong">錯題本<span class="badge" id="wrongBadge" hidden>0</span></button>
    <button role="tab" id="tab-time" aria-selected="false" data-tab="time">速讀時間軸</button>
    <button role="tab" id="tab-dict" aria-selected="false" data-tab="dict">陷阱字典</button>
  </nav>
  <main id="view"></main>
</div>

<script>
// a = index of correct option (default 0, options are shuffled unless f:1)
const Q1 = [
// ===== 權利與責任 rights =====
{c:'rights',t:'N',q:'Which of the following is **NOT** a responsibility of Canadian citizenship?',z:'下列哪一項「不是」加拿大公民的責任？',
o:[['Owning a home','擁有自己的房子'],['Obeying the law','遵守法律'],['Serving on a jury when called to do so','被傳喚時擔任陪審員'],['Taking responsibility for oneself and one\'s family','照顧自己和家人']],
e:'公民責任包括：守法、照顧自己與家人、擔任陪審員、投票、幫助社區、保護遺產與環境。買房子不是責任。',k:[['responsibility','責任'],['jury','陪審團']]},
{c:'rights',t:'S',q:'The Canadian Charter of Rights and Freedoms was **entrenched** in which document?',z:'《權利與自由憲章》被「寫入（確立）」在哪一份文件中？',
o:[['The Constitution of Canada, in 1982','1982 年的加拿大憲法'],['The British North America Act, in 1867','1867 年的英屬北美法案'],['Magna Carta, in 1215','1215 年的大憲章'],['The Quebec Act, in 1774','1774 年的魁北克法案']],
e:'1982 年憲法修改時加入了《權利與自由憲章》。entrenched = 牢固地寫進去。',k:[['entrenched','確立、寫入（法律中）'],['Charter','憲章']]},
{c:'rights',t:'R',q:'Which document, signed in England in 1215, is the **source** of freedoms such as habeas corpus?',z:'哪份 1215 年在英國簽署的文件，是人身保護令等自由的「源頭」？',
o:[['Magna Carta (the Great Charter of Freedoms)','大憲章'],['The Canadian Charter of Rights and Freedoms','加拿大權利與自由憲章'],['The Constitution Act, 1982','1982 年憲法法案'],['The Royal Proclamation of 1763','1763 年皇家公告']],
e:'題目沒說 Magna Carta，而是給年份和用途反問你。1215 年 = 大憲章。',k:[['source','來源'],['habeas corpus','人身保護令']]},
{c:'rights',t:'S',q:'"Habeas corpus" gives you the right to:',z:'「Habeas corpus（人身保護令）」給你什麼權利？',
o:[['Challenge unlawful detention by the state','挑戰政府的非法拘留'],['Vote in municipal elections','在市政選舉投票'],['Own land anywhere in Canada','在加拿大任何地方擁有土地'],['Use either official language in court','在法庭使用任一官方語言']],
e:'Habeas corpus 是拉丁文，意思是政府不能隨便把人關起來，你有權挑戰非法拘留。',k:[['unlawful','非法的'],['detention','拘留']]},
{c:'rights',t:'W',q:'Which statement about **mobility rights** is **TRUE**?',z:'關於「遷徙權」，哪一句是「正確」的？',
o:[['Canadians can live and work anywhere in Canada, enter and leave the country freely, and apply for a passport','加拿大人可在全國任何地方居住工作、自由出入境、申請護照'],['Canadians need permission to move to another province','搬到別省需要許可'],['Only citizens born in Canada may leave and re-enter freely','只有在加拿大出生的公民才能自由出入境'],['Mobility rights apply only to people over 21','遷徙權只適用於 21 歲以上']],
e:'mobility = 移動。遷徙權：在任何地方生活工作、自由出入境、申請護照。',k:[['mobility','移動、遷徙'],['statement','敘述、句子']]},
{c:'rights',t:'N',q:'All of the following are fundamental freedoms protected by the Charter **EXCEPT**:',z:'以下都是憲章保護的基本自由，「除了」哪一項？',
o:[['Freedom from paying taxes','不用繳稅的自由'],['Freedom of conscience and religion','良心與宗教自由'],['Freedom of thought, belief, opinion and expression','思想、信仰、意見與表達自由'],['Freedom of peaceful assembly','和平集會自由']],
e:'EXCEPT = 除了……以外。題目要你找「不屬於」的那一個。四大基本自由：良心與宗教、思想信仰表達（含言論與新聞）、和平集會、結社。',k:[['EXCEPT','除了（找不屬於的）'],['assembly','集會']]},
{c:'rights',t:'C',q:'Your neighbour receives a notice to **serve on a jury**. What should she do?',z:'你的鄰居收到「擔任陪審員」的通知，她應該怎麼做？',
o:[['Serve when called; it is a responsibility of citizenship','被傳喚就去，這是公民責任'],['Ignore it unless she wants to volunteer','除非想當義工，否則不理'],['Pay a fee to be excused automatically','付錢就自動免除'],['Only citizens over 65 need to serve','只有 65 歲以上的公民需要去']],
e:'情境題：換成「鄰居收到通知」的故事，其實就是問「擔任陪審員是公民責任」。',k:[['notice','通知'],['serve on a jury','擔任陪審員']]},
{c:'rights',t:'T',q:'True or False: In Canada, men and women are **equal** under the law.',z:'是非題：在加拿大，男女在法律面前平等。',
o:[['True','對'],['False','錯']],a:0,f:1,
e:'正確。Discover Canada 明確寫出男女在法律上平等。',k:[['equal','平等']]},
{c:'rights',t:'S',q:'Which of the following is a **RESPONSIBILITY** rather than a right?',z:'下列哪一項是「責任」而「不是」權利？',
o:[['Obeying the law','遵守法律'],['Freedom of religion','宗教自由'],['Mobility rights','遷徙權'],['Official language rights','官方語言權利']],
e:'rather than = 而不是。宗教自由、遷徙權、語言權都是「權利」；守法是「責任」。',k:[['rather than','而不是'],['right','權利']]},
{c:'rights',t:'C',q:'Someone says violence against a spouse is acceptable because of his cultural traditions. According to Canadian law, this is:',z:'有人說因為文化傳統，對配偶施暴是可以接受的。依照加拿大法律，這是：',
o:[['A crime that is severely punished','會被嚴厲懲罰的罪行'],['Acceptable if it happens at home','在家裡發生就可以'],['Allowed for newcomers during their first three years','新移民前三年可以'],['A matter only for religious leaders','只由宗教領袖處理']],
e:'加拿大的開放不包括家暴、名譽殺人、女性割禮、強迫婚姻等野蠻習俗，這些都依法嚴懲。',k:[['spouse','配偶'],['severely','嚴厲地']]},
{c:'rights',t:'S',q:'Military service in Canada is:',z:'在加拿大服兵役是：',
o:[['Not compulsory, but serving is a noble way to contribute','不是義務的，但服役是貢獻國家的高尚方式'],['Compulsory for all men aged 18 to 25','18–25 歲男性必須服役'],['Compulsory for all new citizens','所有新公民必須服役'],['Not allowed for dual citizens','雙重國籍者不可服役']],
e:'compulsory = 強制的。加拿大沒有強制兵役。',k:[['compulsory','強制的、義務的'],['noble','高尚的']]},
{c:'rights',t:'R',q:'Which action is an example of **protecting and enjoying our heritage and environment**?',z:'哪個行為是「保護與享受我們的遺產和環境」的例子？',
o:[['Avoiding waste and pollution while protecting natural, cultural and architectural heritage','避免浪費和污染，同時保護自然、文化和建築遺產'],['Voting only in federal elections','只在聯邦選舉投票'],['Joining the Canadian Forces','加入加拿大軍隊'],['Learning both official languages','學習兩種官方語言']],
e:'heritage = 遺產；environment = 環境。答案重點：不浪費、不污染、保護遺產。',k:[['heritage','遺產'],['pollution','污染']]},
{c:'rights',t:'W',q:'Which statement about the **rule of law** in Canada is **TRUE**?',z:'關於加拿大的「法治」，哪一句是「正確」的？',
o:[['Everyone, including police, judges and politicians, must follow the law','每個人，包括警察、法官、政治人物，都必須守法'],['Government officials are above the law','政府官員可以不受法律約束'],['The law applies only to citizens','法律只適用於公民'],['Judges may ignore laws they disagree with','法官可以不理自己不同意的法律']],
e:'rule of law = 法治：所有人都要守法，沒有人在法律之上。',k:[['rule of law','法治'],['above the law','凌駕法律之上']]},

const SETS=['A','B','C'];

// ---- assign questions to sets (round-robin per chapter so each set covers every chapter)
const ALL=[...Q1,...Q2];

const bySet={A:[],B:[],C:[]};
let rr=0;
Object.keys(byCh).forEach(c=>{byCh[c].forEach(q=>{const s=SETS[rr%3];rr++;bySet[s].push(q)})});
SETS.forEach(s=>bySet[s].forEach((q,i)=>{q.set=s;q.id=s+String(i+1).padStart(2,'0');if(q.a==null)q.a=0}));
const BYID={};ALL.forEach(q=>BYID[q.id]=q);

// ---- wrong-question store: one private book per person (name + PIN), kept in Firestore and synced across devices
const FB_KEY='AIzaSyBoo7eK2jYNIzKIpOwV-gQ5rk7OLdDaJO0';
const FB_URL='https://firestore.googleapis.com/v1/projects/citizenship-quiz-27223/databases/(default)/documents/books/';
let wrong={}; // id -> {n:count, t:timestamp, pick:text}
let me=null; // {name, id}
let sync='ok'; // ok | saving | offline
let flash='';
try{me=JSON.parse(localStorage.getItem('citz-me')||'null')}catch(e){}
const lsKey=()=>'citz-wrong:'+me.id, pendKey=()=>'citz-pending:'+me.id;
function lsLoad(){try{return JSON.parse(localStorage.getItem(lsKey())||'{}')}catch(e){return {}}}
function lsSave(){try{localStorage.setItem(lsKey(),JSON.stringify(wrong))}catch(e){}}
function setPending(v){try{v?localStorage.setItem(pendKey(),'1'):localStorage.removeItem(pendKey())}catch(e){}}
function isPending(){try{return localStorage.getItem(pendKey())==='1'}catch(e){return false}}
async function bookId(name,pin){
  const d=new TextEncoder().encode('citz-v1|'+name.trim().toLowerCase()+'|'+pin);
  const h=await crypto.subtle.digest('SHA-256',d);
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function fetchBook(id){
  const r=await fetch(FB_URL+id+'?key='+FB_KEY,{cache:'no-store'});
  if(r.status===404)return {};
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();
  return JSON.parse(((j.fields||{}).items||{}).stringValue||'{}');
}
async function saveBook(id,items){
  const r=await fetch(FB_URL+id+'?key='+FB_KEY,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fields:{items:{stringValue:JSON.stringify(items)},updated:{stringValue:new Date().toISOString()}}})});
  if(!r.ok)throw new Error('http '+r.status);
}
let saving=false,dirty=false;
async function persist(){
  if(!me)return;
  lsSave();setPending(true);updateBadge();
  if(saving){dirty=true;return}
  saving=true;sync='saving';
  const id=me.id;
  try{await saveBook(id,wrong);if(me&&me.id===id){setPending(false);sync='ok'}}catch(e){sync='offline'}
  saving=false;refreshSyncLabel();
  if(dirty){dirty=false;persist()}
}
async function pull(){
  if(!me||saving)return;
  if(isPending()){persist();return} // local changes not uploaded yet: they win
  const id=me.id;
  try{
    const items=await fetchBook(id);
    if(!me||me.id!==id||saving||isPending())return;
    sync='ok';
    if(JSON.stringify(items)!==JSON.stringify(wrong)){wrong=items;lsSave();updateBadge();if(!state.run)render()}
    else refreshSyncLabel();
  }catch(e){sync='offline';refreshSyncLabel()}
}
function markWrong(q,pickText){const w=wrong[q.id]||{n:0};w.n++;w.t=Date.now();if(pickText)w.pick=pickText;wrong[q.id]=w;persist()}

function takeImport(){

function tick(){const r=state.run;if(!r||r.finished)return;const left=r.end-Date.now();const el=document.getElementById('timer');if(left<=0){finishExam();return}if(el){el.textContent=fmt(left);el.classList.toggle('low',left<5*60*1000)}}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function qBlock(it,opts){

  <div class="tools">${canSpeak?'<button class="chip" id="spk">朗讀英文</button>':''}<button class="chip" id="zhAll" aria-pressed="${showZh}">中文翻譯：${showZh?'開':'關'}</button>${!showZh?`<button class="chip" id="zhOne">這題看中文</button>`:''}${opts.extraTools||''}</div>
  <div class="opts">`;
  it.ord.forEach((oi,k)=>{
    const o=q.o[oi];let cls='';
    if(opts.reveal){if(oi===q.a)cls='right';else if(it.pick===oi)cls='wrong'}
    else if(it.pick===oi)cls='sel';
    h+=`<button class="opt ${cls}" data-oi="${oi}" ${opts.reveal?'disabled':''}><span class="l">${L[k]}</span><span class="t"><span class="en">${esc(o[0])}</span>${zhOn?`<span class="zh">${esc(o[1])}</span>`:''}</span></button>`;
  });

    const ok=it.pick===q.a;
    h+=`<div class="fb"><div class="res ${ok?'ok':'no'}">${it.pick==null?'標記為不會':ok?'答對了':'答錯了'}　正確答案：${esc(q.o[q.a][0])}</div><div>${esc(q.e)}</div>${vocab(q)}</div>`;
  }
  h+='</div>';
  return h;
}
function vocab(q){return q.k&&q.k.length?`<div class="vocab">${q.k.map(k=>`<span><b>${esc(k[0])}</b> ${esc(k[1])}</span>`).join('')}</div>`:''}
function bindQ(it,onPick){
  const q=it.q;
  const s=document.getElementById('spk');if(s)s.onclick=()=>speak(q.q+' '+it.ord.map((oi,k)=>L[k]+'. '+q.o[oi][0]).join('. '));

}

function finishExam(){

// ---- PDF export: draw pages on canvas (keeps Chinese fonts), assemble with jsPDF
async function exportPdf(ids){
  const st=document.getElementById('st');const btn=document.getElementById('pdf');
  if(!window.jspdf){st.textContent='PDF 元件沒有載入，請重新整理頁面後再試。';return}
  btn.disabled=true;st.textContent='正在產生 PDF…';
  try{
    const qs=ids.map(id=>BYID[id]);
    const allText=qs.map(q=>q.q+q.z+q.o.map(o=>o.join('')).join('')+q.e+(q.k||[]).flat().join('')).join('')+'入籍陷阱題錯題本正確答案你選的解析關鍵字第頁共題';
    try{await Promise.all(['400 20px "Noto Sans TC"','700 20px "Noto Sans TC"','400 20px "Atkinson Hyperlegible"','700 20px "Atkinson Hyperlegible"'].map(f=>document.fonts.load(f,allText)))}catch(e){}
    const W=1240,H=1754,M=100,CW=W-M*2;
    const EN='"Atkinson Hyperlegible", Arial, sans-serif',ZH='"Noto Sans TC", "PingFang TC", sans-serif';
    const pages=[];let cv,cx,y;
    const newPage=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.textBaseline='top';y=M;pages.push(cv)};
    const tok=s=>s.match(/[⺀-鿿＀-￯　-〿]|[^\s⺀-鿿＀-￯　-〿]+|\s+/g)||[];
    function wrap(ctx,text,font,width){ctx.font=font;const lines=[];let line='';for(const t of tok(text)){const test=line+t;if(ctx.measureText(test).width>width&&line.trim()){lines.push(line.trimEnd());line=t.trimStart()}else line=test}if(line.trim())lines.push(line.trimEnd());return lines}
    const date=new Date().toLocaleDateString('zh-TW');
    // measure a block with a scratch context
    const scratch=document.createElement('canvas').getContext('2d');
    function blockLines(q,n){
      const w=wrong[q.id]||{};
      const parts=[];
      parts.push({f:`500 22px ${ZH}`,c:'#A34405',t:`${n}. ${TR[q.t]} · ${CH[q.c]} · 錯 ${w.n||1} 次`,gap:6});
      parts.push({f:`700 32px ${EN}`,c:'#15202A',t:plain(q.q),lh:44,gap:6});
      parts.push({f:`400 26px ${ZH}`,c:'#566471',t:q.z,lh:38,gap:12});
      q.o.forEach((o,i)=>{const ok=i===q.a;parts.push({f:`${ok?700:400} 27px ${EN}`,c:ok?'#146C3E':'#15202A',t:(ok?'✔ ':'○ ')+o[0]+'　'+o[1],lh:38,gap:4,ind:10})});
      if(w.pick)parts.push({f:`400 24px ${ZH}`,c:'#AE2318',t:'你選的：'+w.pick,lh:34,gap:8});
      parts.push({f:`400 25px ${ZH}`,c:'#15202A',t:'解析：'+q.e,lh:37,gap:6});
      if(q.k&&q.k.length)parts.push({f:`400 23px ${ZH}`,c:'#0F5E6B',t:'關鍵字：'+q.k.map(k=>k[0]+' '+k[1]).join('；'),lh:34,gap:0});
      let h=0;parts.forEach(p=>{p.lines=wrap(scratch,p.t,p.f,CW-(p.ind||0));p.lh=p.lh||32;h+=p.lines.length*p.lh+p.gap});
      return {parts,h:h+44};
    }
    newPage();
    cx.fillStyle='#0F5E6B';cx.font=`500 20px ${EN}`;cx.fillText('CANADIAN CITIZENSHIP TEST · TRAP EDITION',M,y);y+=34;
    cx.fillStyle='#15202A';cx.font=`700 46px ${ZH}`;cx.fillText('入籍陷阱題 錯題本',M,y);y+=64;
    cx.fillStyle='#566471';cx.font=`400 24px ${ZH}`;cx.fillText(`共 ${qs.length} 題 · 匯出日期 ${date} · 綠色打勾為正確答案`,M,y);y+=50;
    cx.fillStyle='#D3DBDF';cx.fillRect(M,y,CW,2);y+=34;
    qs.forEach((q,i)=>{
      const b=blockLines(q,i+1);
      if(y+b.h>H-M)newPage();
      b.parts.forEach(p=>{cx.fillStyle=p.c;cx.font=p.f;p.lines.forEach(l=>{cx.fillText(l,M+(p.ind||0),y);y+=p.lh});y+=p.gap});
      y+=20;cx.fillStyle='#E7ECEE';cx.fillRect(M,y,CW,2);y+=24;
    });
    pages.forEach((p,i)=>{const c=p.getContext('2d');c.fillStyle='#94A3AF';c.font=`400 20px ${ZH}`;c.textAlign='center';c.fillText(`第 ${i+1} / ${pages.length} 頁`,W/2,H-60)});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(p.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297)});
    const blob=pdf.output('blob');
    const fname='citizenship-wrong-questions-'+new Date().toISOString().slice(0,10)+'.pdf';
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    st.textContent=`已匯出 ${qs.length} 題（${pages.length} 頁）。`;
  }catch(e){st.textContent='產生 PDF 時出了問題，請重新整理後再試。'}
  btn.disabled=false;
}
